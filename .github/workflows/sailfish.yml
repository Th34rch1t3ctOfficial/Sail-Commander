name: build-sailfish

# Builds the Sailfish OS package (RPM) of Sail Commander

# Started manually only (Actions -> build-sailfish -> Run workflow),
# so the package is built once all the changes are done

on:
  workflow_dispatch:

concurrency:
  group: sailfish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl]
    env:
      RELEASE: 4.6.0.13
    steps:
      - uses: actions/checkout@v4

      # The SDK container builds the package; the test check which runs
      # after the build fails because there are no test packages, so the
      # result is decided by the RPM being there (checked by the upload)
      - name: Build RPM
        run: |
          mkdir -p RPMS
          sudo chmod a+w RPMS
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            coderus/sailfishos-platform-sdk:${RELEASE} \
            /bin/bash -c "set -x; mkdir -p build && cd build && cp -r /workspace/* . && \
              { mb2 -t SailfishOS-${RELEASE}-${{ matrix.arch }} build || echo 'mb2 exit code' \$?; } && \
              cp RPMS/*.rpm /workspace/RPMS/"
          ls -l RPMS

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: sailcommander-${{ matrix.arch }}
          path: RPMS/*.rpm
          if-no-files-found: error
